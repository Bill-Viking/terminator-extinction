<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts-inline.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #05070A; font-family: 'IBM Plex Mono', monospace; }
  #card { position: relative; width: 1280px; height: 720px;
          background: linear-gradient(180deg, #070A0D 0%, #05070A 45%, #030507 100%); }
  svg { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div style="position:absolute;left:-9999px;top:0"><span style="font-family:'IBM Plex Mono'">x</span><span style="font-family:'IBM Plex Mono';font-weight:600">x</span><span style="font-family:'Space Grotesk';font-weight:700">x</span></div>
<div id="card"><svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg></div>
<script>
let seed = 20290829; // Judgment Day + a pinch
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
const S = document.getElementById('s');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a, parent) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); (parent || S).appendChild(e); return e; };
const txt = (x, y, s, fill, size, opts = {}) => {
  const e = el('text', Object.assign({ x, y, fill, 'font-size': size,
    'letter-spacing': '0.1em', 'font-family': "'IBM Plex Mono', monospace" }, opts));
  e.textContent = s; return e; };

const W = 1280, H = 720, L = 60, R = 1220;
const SX = 660, SW = 30;              // hero stream x / width

const defs = el('defs', {});
const blur = (id, dev) => { const f = el('filter', { id, x: '-80%', y: '-80%', width: '260%', height: '260%' }, defs);
  el('feGaussianBlur', { stdDeviation: dev }, f); };
blur('soft', 2.5); blur('bloom', 12);
const grad = el('linearGradient', { id: 'fall', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el('stop', { offset: '0%',  'stop-color': '#FFD13A', 'stop-opacity': 0.15 }, grad);
el('stop', { offset: '80%', 'stop-color': '#F2B705', 'stop-opacity': 0.45 }, grad);
el('stop', { offset: '100%','stop-color': '#FFE58D', 'stop-opacity': 0.8 }, grad);

// ---- header / footer -------------------------------------------------------
el('line', { x1: 22, y1: 34, x2: W - 22, y2: 34, stroke: '#1B2430', 'stroke-width': 1 });
el('line', { x1: 22, y1: H - 36, x2: W - 22, y2: H - 36, stroke: '#1B2430', 'stroke-width': 1 });
txt(22, 22, 'TERMINATOR: EXTINCTION · THE CANON — HOW THE DOCUMENTS FIT', '#7E8792', 10.5, {'letter-spacing':'0.18em'});
txt(W - 22, 22, 'READ TOP TO BOTTOM', '#7E8792', 10.5, {'letter-spacing':'0.18em','text-anchor':'end'});
txt(22, H - 15, 'FIG.2 — the script falls through its reference; the sequels are the landing.', '#585F6A', 10.5, {'letter-spacing':'0.14em'});
txt(W - 22, H - 15, 'REFERENCE MATERIAL/README.MD', '#585F6A', 10.5, {'letter-spacing':'0.14em','text-anchor':'end'});

// ---- the rim: world bible --------------------------------------------------
const rimY = 62;
el('rect', { x: L, y: rimY, width: R - L, height: 24, fill: 'none',
             stroke: '#7FB0E8', 'stroke-width': 1, rx: 2, opacity: 0.8 });
for (let x = L + 8; x < R - 8; x += 14) {   // faint cell texture inside the rim
  const v = rnd();
  el('rect', { x, y: rimY + 7, width: 9, height: 3.4, rx: 1,
               fill: '#7FB0E8', opacity: (0.08 + v * 0.22).toFixed(3) });
}
el('rect', { x: SX - 210, y: rimY + 3, width: 420, height: 18, fill: '#070A0D', opacity: 0.92 });
txt(SX, rimY + 16, 'RIM · WORLD BIBLE — the front door', '#D6E9FF', 11.5,
    {'text-anchor':'middle','font-weight':600});
txt(R, rimY - 7, 'TERMINATOR_EXTINCTION_World_Bible.md', '#4E5E78', 9.5, {'text-anchor':'end'});

// ---- the script chip -------------------------------------------------------
const chipY = 100;
el('rect', { x: SX - 62, y: chipY, width: 124, height: 22, rx: 3, fill: '#FFD13A' });
txt(SX, chipY + 15, 'THE SCRIPT', '#181509', 11.5, {'text-anchor':'middle','font-weight':600});
txt(SX + 76, chipY + 15, 'TERMINATOR_EXTINCTION.pdf · 96 pp', '#8E97A2', 9.5);

// ---- the four walls --------------------------------------------------------
const walls = [
  { n: '01', name: 'DEVELOPMENT OUTLINE', file: '01-development-outline.txt', note: 'the authoritative blueprint · 130 changes' },
  { n: '02', name: 'STRUCTURAL LOGIC',    file: '02-structural-logic.docx',   note: "why Skynet can't nuke · the Relay · the Silence" },
  { n: '03', name: 'THEMES & MESSAGE',    file: '03-themes-and-message.docx', note: 'the thematic spine and craft rules' },
  { n: '04', name: 'TIME-TRAVEL RULES',   file: '04-time-travel-rules.txt',   note: 'short and final — the first question, answered' },
];
const wTop = 140, wH = 64, wGap = 22;
const cellW = 10, cellH = 3.4, gx = 4, gy = 4.4;
walls.forEach((w, i) => {
  const y0 = wTop + i * (wH + wGap);
  const wallG = el('g', {});
  for (let sx = L; sx < R - 30; sx += 3 * (cellW + gx) + 11) {
    for (let r = 0; r < Math.floor(wH / (cellH + gy)); r++) {
      for (let c = 0; c < 3; c++) {
        const v = rnd();
        const o = v < 0.6 ? 0.08 + v * 0.1 : v < 0.9 ? 0.16 + (v - 0.6) * 0.5 : 0.4 + (v - 0.9) * 3.5;
        el('rect', { x: sx + c * (cellW + gx), y: (y0 + r * (cellH + gy)).toFixed(1),
                     width: cellW, height: cellH, rx: 1,
                     fill: v > 0.97 ? '#D6E9FF' : '#7FB0E8', opacity: Math.min(o, 0.9).toFixed(3) }, wallG);
      }
    }
  }
  // label plates on the screen's own ground
  el('rect', { x: L - 4, y: y0 + 2, width: 268, height: 30, fill: '#05070A', opacity: 0.88 });
  txt(L + 4, y0 + 15, w.n + ' · ' + w.name, '#7FB0E8', 11, {'font-weight':600});
  txt(L + 4, y0 + 28, w.file, '#4E5E78', 9.5);
  el('rect', { x: R - 340, y: y0 + wH - 18, width: 340, height: 16, fill: '#05070A', opacity: 0.88 });
  txt(R, y0 + wH - 6, w.note, '#585F6A', 9.5, {'text-anchor':'end'});
});
const wallsBottom = wTop + walls.length * (wH + wGap) - wGap;

// ---- the hero stream through it all ----------------------------------------
const sTop = chipY + 24, sBot = 620;
el('rect', { x: SX - SW * 1.5, y: sTop, width: SW * 3, height: sBot - sTop, fill: '#05070A', opacity: 0.5 });
el('rect', { x: SX - SW / 2, y: sTop, width: SW, height: sBot - sTop, fill: 'url(#fall)', opacity: 0.55, filter: 'url(#bloom)' });
const gSoft = el('g', { filter: 'url(#soft)', opacity: 0.85 }), gSharp = el('g', {});
for (let i = 0; i < 2400; i++) {
  const t = rnd(), spread = (rnd() + rnd() + rnd()) / 3 - 0.5;
  const x = SX + spread * SW * (0.8 + t * 0.5), y = sTop + t * (sBot - sTop);
  const v = rnd();
  el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: v > 0.93 ? 1.6 : v > 0.6 ? 1.05 : 0.65,
                 fill: v > 0.9 ? '#FFE58D' : v > 0.45 ? '#FFD13A' : '#F2B705',
                 opacity: (0.25 + rnd() * 0.55).toFixed(2) }, rnd() > 0.7 ? gSharp : gSoft);
}
// green key at the second wall
const keyY = wTop + wH + wGap + 20;
el('line', { x1: SX + 26, y1: keyY, x2: SX + 48, y2: keyY, stroke: '#5FC873', 'stroke-width': 2.5 });
el('rect', { x: SX + 52, y: keyY - 10, width: 224, height: 16, fill: '#05070A', opacity: 0.88 });
txt(SX + 56, keyY + 3, 'KEY · the rules hold · 1.0000', '#5FC873', 10);

// ---- the notes row (05–10) -------------------------------------------------
const notes = [
  { n: '05', name: 'machine consciousness' },
  { n: '06', name: 'temptation & the machine mind' },
  { n: '07', name: 'self-preservation logic' },
  { n: '08', name: 'interior design notes' },
  { n: '09', name: 'joan of arc imagery' },
  { n: '10', name: 'chrome materials (pdf)' },
];
const nY = wallsBottom + 26, nW = (R - L - 5 * 14) / 6, nH = 44;
notes.forEach((nt, i) => {
  const x0 = L + i * (nW + 14);
  el('rect', { x: x0, y: nY, width: nW, height: nH, fill: '#05070A', opacity: 0.9, rx: 2 });
  el('rect', { x: x0, y: nY, width: nW, height: nH, fill: 'none', stroke: '#22303F', 'stroke-width': 1, rx: 2 });
  for (let xx = x0 + 6; xx < x0 + nW - 12; xx += 13) {
    el('rect', { x: xx, y: nY + 6, width: 8, height: 3, rx: 1, fill: '#7FB0E8', opacity: (0.06 + rnd() * 0.16).toFixed(3) });
  }
  txt(x0 + 8, nY + 25, nt.n, '#7FB0E8', 10.5, {'font-weight':600});
  txt(x0 + 8, nY + 37, nt.name, '#8E97A2', 8.8, {'letter-spacing':'0.04em'});
});
txt(L, nY - 8, 'SUPPORTING NOTES — the smaller walls', '#585F6A', 9.5);
txt(R, nY - 8, 'sketches/ — the early self-awareness drawings', '#4E5E78', 9.5, {'text-anchor':'end'});

// ---- the landing: sequels --------------------------------------------------
const landY = 630;
el('ellipse', { cx: SX, cy: landY, rx: 200, ry: 7, fill: '#FFE58D', opacity: 0.4, filter: 'url(#bloom)' });
for (let i = 0; i < 160; i++) {
  const a = rnd() * Math.PI, d = rnd() * 190;
  el('circle', { cx: (SX + Math.cos(a) * d).toFixed(1),
                 cy: (landY - Math.abs(Math.sin(a)) * d * 0.12).toFixed(1),
                 r: rnd() > 0.85 ? 1.3 : 0.75, fill: '#FFD13A', opacity: (0.15 + rnd() * 0.45).toFixed(2) });
}
const seq = [
  { name: 'DARK RAIN', file: 'sequels/dark-rain-treatment.docx', x: SX - 300 },
  { name: 'CONCEPT BRIEF', file: 'sequels/sequel-concept-brief.docx', x: SX - 70 },
  { name: 'TRILOGY OUTLINE', file: 'sequels/trilogy-outline.docx', x: SX + 160 },
];
txt(L, landY + 5, 'THE LANDING — WHERE THE STORY GOES NEXT', '#585F6A', 9.5);
seq.forEach(s => {
  el('rect', { x: s.x, y: landY + 14, width: 12, height: 12, fill: '#F2B705', opacity: 0.85, rx: 1.5 });
  txt(s.x + 18, landY + 21, s.name, '#FFD13A', 10, {'font-weight':600});
  txt(s.x + 18, landY + 33, s.file, '#585F6A', 8.8);
});

</script>
</body>
</html>
